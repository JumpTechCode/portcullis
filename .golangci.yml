# golangci-lint configuration (schema v2).
# Pinned to the same version the CI workflow installs.
version: "2"

run:
  timeout: 5m

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose      # HTTP response bodies must be closed
    - copyloopvar    # loop-variable capture correctness
    - depguard       # enforce the internal import DAG (design §3)
    - errorlint      # correct error wrapping / comparison
    - gocritic       # opinionated diagnostics
    - gosec          # security-focused static analysis
    - misspell       # spelling in comments and strings
    - nilerr         # returning nil after a non-nil error
    - revive         # style and documentation rules
    - unconvert      # redundant type conversions
    - unparam        # unused function parameters
    - whitespace     # leading/trailing whitespace
  settings:
    depguard:
      # Fast lint-time enforcement of the architecture's allowed import edges.
      # The precise, per-package DAG is enforced by internal/guard's AST test;
      # these rules are the stable, low-maintenance subset that catches the most
      # damaging violations without enumerating every package.
      rules:
        # domain and guard are graph leaves: no internal imports at all.
        # The invariant governs production code; external test packages
        # legitimately import the package under test, so test files are excluded
        # (as the AST guard also does). The deny is prefix-based, so it also
        # forbids a leaf's own subpackages; that is fine only while both leaves
        # are flat. If either gains a subpackage, add an `allow:` entry for that
        # leaf's own path (the AST guard already tolerates self-imports).
        leaf:
          files:
            - "**/internal/domain/**"
            - "**/internal/guard/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/JumpTechCode/portcullis/internal
              desc: domain and guard are leaves of the import graph and must not import other internal packages
        # Only the composition root (internal/app) and the entrypoint (cmd) may
        # import internal/app; lower layers must never reach up into the root.
        composition-root:
          files:
            - "!**/internal/app/**"
            - "!**/cmd/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/JumpTechCode/portcullis/internal/app
              desc: only internal/app (the composition root) and cmd may import internal/app
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-strings
        - name: context-as-argument
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Test files may use less strict error handling and assertions.
      - path: _test\.go
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/JumpTechCode/portcullis
